<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<style>
html, body { margin: 0; }
.og { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #fbf7f2; color: #2a1f27; font-family: "Atkinson Hyperlegible Next", sans-serif; }
.blob { position: absolute; border-radius: 50%; filter: blur(70px); }
.b1 { width: 700px; height: 700px; left: -220px; top: -320px; background: radial-gradient(circle, rgb(196 160 176 / .8), transparent 62%); }
.b2 { width: 700px; height: 700px; right: -260px; top: -200px; background: radial-gradient(circle, rgb(200 218 196 / .9), transparent 60%); }
.b3 { width: 600px; height: 600px; left: 380px; bottom: -380px; background: radial-gradient(circle, rgb(245 214 196 / .9), transparent 62%); }
.copy { position: absolute; left: 72px; top: 70px; width: 640px; }
.eyebrow { font-weight: 700; font-size: 17px; letter-spacing: .12em; text-transform: uppercase; color: #5e5059; }
h1 { margin: 22px 0 0; font: 700 76px/.98 "Bricolage Grotesque", sans-serif; letter-spacing: -.035em; }
h1 em { font-style: normal; color: #735660; }
.meta { margin-top: 30px; font-size: 24px; color: #5e5059; line-height: 1.5; }
.meta b { color: #735660; }
.arches { position: absolute; right: 60px; bottom: 0; display: flex; gap: 14px; align-items: flex-end; }
.arch { overflow: hidden; border-radius: 999px 999px 0 0; }
.arch img { display: block; width: 100%; height: 100%; object-fit: cover; }
.a1 { width: 200px; height: 290px; }
.a2 { width: 230px; height: 380px; }
</style></head>
<body>
<div class="og" id="og">
  <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
  <div class="copy">
    <p class="eyebrow">Porter Family Dentistry · La Porte, Indiana</p>
    <h1>We treat you like you are <em>our family!</em></h1>
    <p class="meta">David L. Porter, D.D.S., P.C.<br><b>(219) 362-5205</b> · 1112 Indiana Avenue</p>
  </div>
  <div class="arches">
    <div class="arch a1"><img src="../site/assets/img/arch-dr-porter.jpg" alt=""></div>
    <div class="arch a2"><img src="../site/assets/img/arch-family.jpg" alt=""></div>
  </div>
</div>
</body></html>
